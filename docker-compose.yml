services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqua_seal}
      POSTGRES_USER: ${POSTGRES_USER:-aqua_seal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqua_seal}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./backend/migrations/002_phase2_roles.sql:/docker-entrypoint-initdb.d/002_phase2_roles.sql:ro
  - ./backend/migrations/003_marketplace.sql:/docker-entrypoint-initdb.d/003_marketplace.sql:ro

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-aqua_seal}:${POSTGRES_PASSWORD:-aqua_seal}@db:5432/${POSTGRES_DB:-aqua_seal}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
